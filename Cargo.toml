[workspace]
members = ["crates/negative-banding"]
resolver = "3"

[package]
name = "epscan"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Direct Epson ESC/I scanner library and command-line interface"
readme = "README.md"
keywords = ["scanner", "film", "epson", "usb", "esci"]
categories = ["hardware-support", "multimedia::images"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/NOTICE.md", "/docs/**", "/tests/fixtures/**", "/examples/*.rs", "/epscan.pyi", "/pyproject.toml", "/PYTHON.md"]

[lib]
name = "epscan"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "epscan"
path = "src/bin/epscan/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tracing", "dep:tracing-subscriber", "dep:ctrlc", "dep:indicatif"]
python = ["dep:pyo3"]

[dependencies]
nusb = "0.2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = { version = "0.11", default-features = false }
sha2 = "0.10"
log = "0.4"
negative-banding = { version = "0.1.0", path = "crates/negative-banding" }
png = "0.17"
clap = { version = "4", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
ctrlc = { version = "3", optional = true }
indicatif = { version = "0.18", optional = true }
pyo3 = { version = "0.29", features = ["abi3-py313"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
