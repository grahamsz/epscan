[package]
name = "negative-banding"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Shared negative-film band detection, residual refinement, and correction"
repository = "https://github.com/grahamsz/epscan"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustfft = "6.4"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
