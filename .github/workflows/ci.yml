name: CI
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --all-targets --features cli
      - run: cargo test --workspace --locked --lib
      - run: cargo test --workspace --locked --doc
      - run: cargo test --workspace --locked --lib --all-features
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install dist/*.whl
      - run: python tests/python_smoke.py
